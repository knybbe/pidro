<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Green casino felt background -->
  <rect width="64" height="64" rx="14" fill="#0e3822"/>
  
  <!-- 90% height large white playing card -->
  <rect x="9" y="3.5" width="46" height="57" rx="4.5" fill="#fcfcfc" stroke="#e0e6ed" stroke-width="0.8" filter="url(#cardShadow)"/>
  
  <!-- Corner index 5 top-left -->
  <text x="12.5" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#dc2626">5</text>
  <!-- Small heart top-left -->
  <path d="M14.5,16.5 C14.5,15.2 15.7,14.5 16.7,15.5 C17.7,14.5 18.9,15.2 18.9,16.5 C18.9,18.2 16.7,19.8 16.7,19.8 C16.7,19.8 14.5,18.2 14.5,16.5 Z" fill="#dc2626" transform="scale(0.55) translate(11.5, 12.5)"/>

  <!-- 5 Hearts layout: TL, TR, Center, BL, BR -->
  <g fill="#dc2626">
    <!-- Top-Left -->
    <path d="M22,23 C22,20.2 24.5,18.5 26.5,20.8 C28.5,18.5 31,20.2 31,23 C31,27 26.5,30.5 26.5,30.5 C26.5,30.5 22,27 22,23 Z" transform="scale(0.65) translate(8.5, 5)"/>
    <!-- Top-Right -->
    <path d="M22,23 C22,20.2 24.5,18.5 26.5,20.8 C28.5,18.5 31,20.2 31,23 C31,27 26.5,30.5 26.5,30.5 C26.5,30.5 22,27 22,23 Z" transform="scale(0.65) translate(30.5, 5)"/>
    <!-- Center -->
    <path d="M22,23 C22,20.2 24.5,18.5 26.5,20.8 C28.5,18.5 31,20.2 31,23 C31,27 26.5,30.5 26.5,30.5 C26.5,30.5 22,27 22,23 Z" transform="scale(0.75) translate(15.5, 16)"/>
    <!-- Bottom-Left -->
    <path d="M22,23 C22,20.2 24.5,18.5 26.5,20.8 C28.5,18.5 31,20.2 31,23 C31,27 26.5,30.5 26.5,30.5 C26.5,30.5 22,27 22,23 Z" transform="scale(0.65) translate(8.5, 47)"/>
    <!-- Bottom-Right -->
    <path d="M22,23 C22,20.2 24.5,18.5 26.5,20.8 C28.5,18.5 31,20.2 31,23 C31,27 26.5,30.5 26.5,30.5 C26.5,30.5 22,27 22,23 Z" transform="scale(0.65) translate(30.5, 47)"/>
  </g>

  <!-- Corner index 5 bottom-right (upside down) -->
  <text x="-51.5" y="-50" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#dc2626" transform="rotate(180)">5</text>
</svg>
